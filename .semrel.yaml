# yaml-language-server: $schema=https://registry.semrel.io/schemas/core/v1.json
schemaVersion: 1
tagPrefix: v

branches:
  - name: main

rules:
  - type: feat
    bump: minor
  - type: fix
    bump: patch
  - type: perf
    bump: patch
  - type: revert
    bump: patch
  - type: docs
    bump: patch
  - type: test
    bump: patch
  - type: refactor
    bump: patch

# Git tags and GitHub Releases are the release record. The pipeline must never
# create commits, version files, or a generated changelog in the repository.
commit_changelog: false

plugins:
  - uses: "@semrel/provider-github"
    phase: release
